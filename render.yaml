services:
  - type: web
    name: todo-app
    runtime: ruby
    plan: free
    buildCommand: |
      bundle install
      bundle exec rails assets:precompile
      bundle exec rails db:migrate
    startCommand: bundle exec rails server
    envVars:
      - key: RAILS_ENV
        value: production
      - key: SECRET_KEY_BASE
        value: 4c831a1617a4980345d5451afb5771da02ed06cf35be223a2b84588ac6970bbd56c6c8a11169409bd1ab1ab1e9328594f5be7fb5135505bf5a7711dae8b56949
      - key: DATABASE_URL
        fromDatabase:
          name: todo-db
          property: connectionString

databases:
  - name: todo-db
    plan: free
    databaseName: todo_app_production